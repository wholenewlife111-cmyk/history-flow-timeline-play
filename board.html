<!doctype html>
<html lang="ko"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학급 연표판 — 전자칠판</title>
<style>
/* 글꼴은 게임 폴더(fonts/)에 함께 들어 있어서 전자칠판에 설치되어 있지 않아도 똑같이 보여요 */
@font-face{font-family:'Cafe24 Ssurround';src:url(fonts/Cafe24Ssurround.woff2) format('woff2'),url(fonts/Cafe24Ssurround.ttf) format('truetype');font-display:swap}
@font-face{font-family:'SeoulHangangJang';src:url(fonts/SeoulHangangJangM.woff2) format('woff2');font-weight:normal;font-display:swap}
@font-face{font-family:'SeoulHangangJang';src:url(fonts/SeoulHangangJangB.woff2) format('woff2');font-weight:bold;font-display:swap}
:root{--g:#25392F;--b:#976232;--p:#F4EFE3;--line:#C9BFA6;--teal:#2F7A72;--clay:#A0562C;--ink:#25392F;--lav:#6D5D93}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b241f;overflow:hidden;font-family:'SeoulHangangJang','맑은 고딕','Malgun Gothic',sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;line-break:strict}
input,select,button,textarea{font-family:inherit;word-break:keep-all}
/* 퀘스트 순서 */
.quest{position:absolute;top:116px;left:30px;right:30px;height:50px;display:flex;align-items:center;gap:6px;font-size:23px}
.quest .goal{flex:1;min-width:0;color:#5a5446;font-size:17px;line-height:1.2;padding-left:10px;overflow:hidden;max-height:42px}
.quest .goal b{color:var(--b)}
.quest.many{font-size:19px;gap:3px}.quest.many .qs{padding:3px 9px 3px 3px}.quest.many .qs i{width:28px;height:28px;font-size:15px}.quest.many .qarrow{display:none}
.qs{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:30px;padding:3px 14px 3px 4px;color:#8a8070;white-space:nowrap}
.qs i{font-style:normal;display:inline-flex;width:34px;height:34px;border-radius:50%;background:#E9E1CD;align-items:center;justify-content:center;font-size:17px;color:#6c6455}
.qs.on{border-color:var(--b);background:#FFF4E2;color:#5a3a16}.qs.on i{background:var(--b);color:#fff}
.qs.ok{color:var(--teal)}.qs.ok i{background:#CFE6E2;color:var(--teal)}
.qarrow{color:#C9BFA6}
/* 모둠 색 (카드·패) */
.card[data-g="1"]{--gc:#D9534F;--gt:#FBE3E1}.card[data-g="2"]{--gc:#E8A33A;--gt:#FCEFD6}.card[data-g="3"]{--gc:#4C9A5B;--gt:#E0F1E2}.card[data-g="4"]{--gc:#3C7DC4;--gt:#DFEBF8}.card[data-g="5"]{--gc:#8A5CC2;--gt:#ECE3F7}.card[data-g="6"]{--gc:#C25C94;--gt:#F4CDE2}
.card[data-g]{border-image-slice:34;background:var(--gt);background-clip:padding-box;border-radius:6px}
.card[data-g] .gb{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--gc);color:#fff;font-size:17px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0003}
.card[data-g]{padding-left:20px}
.card.ev{border-image-source:url(img/card_standard_normal.png)}
.card.ev.c{background:linear-gradient(90deg,#2F7A7222,transparent 40%)}
.card.ev.r{background:linear-gradient(90deg,#A0562C22,transparent 40%)}
/* 까닭/결과 칸 접기 */
.lane{transition:flex .35s}
.lane.fold{flex:.16;cursor:pointer;overflow:hidden}
.lane.fold .card{display:none}
.lane.fold .lh{writing-mode:vertical-rl;margin:6px auto;font-size:21px}
.lane .lh{cursor:pointer}
.lane .cnt{font-size:15px;color:#8a8070;margin-left:6px}
.f{font-family:'Cafe24 Ssurround','SeoulHangangJang','맑은 고딕',sans-serif;font-weight:normal}
img.px{image-rendering:pixelated}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#FBF8F1;
  background-image:radial-gradient(#e9e1cd 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.top{height:110px;background:var(--g);color:#FFF9EA;display:flex;align-items:center;padding:0 30px;gap:22px}
.top .ttl{font-size:32px;flex:1;line-height:1.1}
.lead{display:flex;align-items:center;gap:8px;background:#FFF9EA;color:var(--ink);border-radius:40px;padding:5px 18px 5px 6px;font-size:19px}
.lead img{width:52px;height:52px}.lead b{font-size:25px}
.cls{font-size:18px;color:#D9B77F;text-align:right}
.main{position:absolute;top:178px;left:30px;right:30px;bottom:200px;display:flex;align-items:stretch;gap:0}
.ring{flex:1;min-width:0;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px;position:relative;display:flex;flex-direction:column;transition:.3s}
.ring.together{flex:.78}
.ring.active{border-color:var(--b);box-shadow:0 0 0 8px #97623226}
.ring.dim{opacity:.5}
.ring.mini{flex:0 0 150px;cursor:default}
.ring.mini .rq,.ring.mini .glines,.ring.mini .lanes,.ring.mini .people,.ring.mini .together-in,.ring.mini .bridge,.ring.mini .mini,.ring.mini .pg,.ring.mini .flags{display:none}
.ring.mini .rh{height:100%;align-items:flex-start}.ring.mini .plaque{flex-direction:column;align-items:center;gap:10px}
.ring.mini .plaque span{writing-mode:vertical-rl;font-size:30px;letter-spacing:2px}
.ring.mini .cstamp{right:14px;bottom:14px;top:auto}
.rh{display:flex;align-items:center;gap:10px}
.plaque{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.plaque img{width:64px;height:40px;flex:none}
.plaque span{color:#5a3a16;font-size:28px;line-height:1.15}
.mini{white-space:nowrap}
.pg{font-size:22px;color:#655F52}
.mini{margin-left:auto;font-family:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:4px}
.mini img{width:30px;height:30px}
.rq{font-size:28px;margin:6px 4px 8px;color:#25392F;line-height:1.3;font-weight:bold}.rq::before{content:'핵심 질문';display:inline-block;font-weight:normal;font-family:'Cafe24 Ssurround','SeoulHangangJang',sans-serif;font-size:19px;color:#fff;background:#2F7A72;border-radius:999px;padding:1px 12px 2px;margin-right:10px;vertical-align:3px}
.bframe{margin-top:6px;background:#fff;border-radius:10px;padding:6px 10px;font-size:23px;color:#3d4a42;white-space:pre-wrap}.bframe b,.bkeys b{color:#976232;margin-right:6px}
.bkeys{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:22px}.bkeys span{background:#25392F;color:#FFF9EA;border-radius:14px;padding:1px 12px}
.bridge{font-size:24px;line-height:1.4;background:#FFF0D9;border:2px dashed var(--b);border-radius:12px;padding:6px 10px;margin:0 0 8px;color:#6b4a22}
.lanes{display:flex;gap:10px;flex:1;min-height:0}
.lane{flex:1;border-radius:14px;padding:8px;overflow:auto}
.lane.c{background:#E3F0EE}.lane.r{background:#F6E7DC}
.lh{font-size:26px;margin:0 0 6px 4px}.lane.c .lh{color:var(--teal)}.lane.r .lh{color:var(--clay)}
.people{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.prow{display:flex;gap:8px;flex:1;min-height:0;align-items:stretch}
.pname{width:200px;flex:none;position:relative;display:flex;align-items:center;justify-content:center}
.pname img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pname span{position:relative;font-size:26px;color:#3b2a14}
.prow .lane{padding:4px}
.card{position:relative;border:18px solid transparent;border-image-slice:34 fill;border-image-width:18px;border-image-repeat:stretch;
  padding:1px 5px;margin-bottom:6px;font-size:22px;line-height:1.28;cursor:pointer;image-rendering:pixelated}
.card.new{animation:pop .45s}
.card.c{border-image-source:url(img/card_cause_normal.png)}.card.r{border-image-source:url(img/card_result_normal.png)}
.card.std{border-image-source:url(img/card_standard_normal.png);font-weight:bold}
.card .m{font-size:18px;color:#6c6455;margin-top:1px;font-weight:normal}
.card .qq{font-size:15px;color:var(--lav);font-weight:normal}
.card.sel{filter:drop-shadow(0 0 10px #E8B04A)}
.card.ok::after{content:'';position:absolute;right:-14px;top:-18px;width:42px;height:42px;background:url(img/S4_01_stamp_required.webp) center/contain no-repeat}
.card .tag{position:absolute;left:-10px;top:-20px;font-size:13px;background:var(--g);color:#FFF9EA;border-radius:8px;padding:1px 8px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.link{width:110px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:15px;color:#7c735f}
.link img{width:84px;height:84px;margin:6px 0;transition:.4s}
.link.done{color:var(--b)}.link.done img{filter:drop-shadow(0 0 12px #E8B04A);transform:scale(1.15)}
.cstamp{position:absolute;right:330px;top:-34px;width:104px;height:104px;z-index:4;display:none;align-items:center;justify-content:center;transform:rotate(-12deg)}
.cstamp img{position:absolute;inset:0;width:100%;height:100%}
.cstamp span{position:relative;color:#9E2B22;font-size:27px;line-height:1.05;text-align:center}
.ring.done .cstamp{display:flex;animation:pop .6s;right:18px;bottom:10px;top:auto;width:96px;height:96px}
.flags{position:absolute;right:10px;top:-34px;display:flex;gap:6px;z-index:3}
.flag{display:flex;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:2px 10px 2px 2px;font-size:16px;cursor:pointer}
.flag img{width:40px;height:40px}.flag .hp{color:#8a6a1e;font-size:14px}
.qcol{width:440px;flex:none;margin-left:14px;background:#fff;border:3px solid var(--lav);border-radius:22px;padding:12px;overflow:auto}
.qcol h3{margin:0 0 8px;font-size:24px;color:var(--lav)}.qin{display:flex;gap:6px;margin-bottom:6px}.qin input{flex:1;min-width:0;font-size:20px;padding:6px 8px;border:2px solid var(--lav);border-radius:10px}.qin button{font-size:20px;border-radius:10px;border:0;background:var(--lav);color:#fff;padding:0 12px}.qcnt{font-size:17px;color:#6c6455;margin-bottom:8px}
.qcard{border:16px solid transparent;border-image:url(img/card_question_normal.png) 34 fill / 16px stretch;padding:2px 4px;font-size:18px;margin-bottom:6px;image-rendering:pixelated}
.bottom{position:absolute;left:30px;right:30px;bottom:16px;height:170px;background:var(--g);border-radius:22px;display:flex;align-items:center;padding:0 20px 0 190px;gap:18px;color:#FFF9EA}
.guide{position:absolute;left:12px;bottom:4px;width:150px;height:200px;object-fit:contain;object-position:bottom}
.say{flex:1;font-size:29px;line-height:1.3}.say small{display:block;color:#E8D3A8;font-size:23px;line-height:1.3}
.btns{display:grid;grid-template-columns:repeat(2,auto);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:6px;align-items:stretch;max-height:164px}
.btns .btn{padding:8px 16px}
.btn{border:0;border-radius:14px;padding:11px 20px;font-size:24px;cursor:pointer;background:var(--b);color:#fff;font-family:inherit;white-space:nowrap}
.btn.l{background:#FFF9EA;color:var(--ink)}.btn.s{font-size:20px;padding:7px 14px;background:#3c5446}
.together-in{display:flex;gap:8px;align-items:center;margin-top:6px}
.together-in input{flex:1;font-family:inherit;font-size:23px;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.together-in button{font-family:inherit;font-size:21px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer}
.together-in button.on.c{background:#E3F0EE;border-color:var(--teal)}.together-in button.on.r{background:#F6E7DC;border-color:var(--clay)}
.menu{position:absolute;z-index:30;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px #0003}
.menu button{font-family:inherit;font-size:19px;border:0;background:var(--p);border-radius:10px;padding:7px 14px;cursor:pointer;text-align:left}
.ov{position:absolute;inset:0;background:#FBF8F1F5;display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column}
.ov.show{display:flex}
.ov h2{font-size:46px;margin:0 0 10px}
.ov .close{position:absolute;right:30px;top:24px}
/* 뽑기 */
.lrow{display:flex;gap:60px;align-items:center}
.lcol{display:flex;flex-direction:column;align-items:center}
.dome{width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffffffee,#e2edf1cc 55%,#b5c7cf);border:14px solid #8B6A3E;position:relative;overflow:hidden}
.ball{position:absolute;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
.ball img{position:absolute;inset:0;width:100%;height:100%}
.ball span{position:relative;color:#fff;font-size:32px;font-weight:bold;text-shadow:0 2px 3px #000a}
.dbase{width:400px;height:64px;background:linear-gradient(#a07a45,#7a5a30);border-radius:0 0 30px 30px;margin-top:-10px}
.bowl{position:relative;width:280px;height:220px}.bowl img.b{position:absolute;bottom:0;width:280px}.bowl .ball{top:0;left:65px}
.wtxt{font-size:40px;min-height:56px;margin-top:8px}
.names{display:flex;flex-wrap:wrap;gap:8px;max-width:620px;justify-content:center;margin:10px 0}
.names span{font-size:21px;background:#fff;border:2px solid var(--line);border-radius:30px;padding:3px 14px}.names span.used{opacity:.35;text-decoration:line-through}
.vol{font-size:19px;color:#3d4a42;max-width:640px;text-align:center;margin:0 0 12px;line-height:1.8}
.vol .pb{font-family:inherit;font-size:18px;border:2px solid #976232;background:#fff;border-radius:20px;padding:2px 12px;margin:2px;cursor:pointer}
.vol input{font-family:inherit;font-size:18px;border:2px solid #C9BFA6;border-radius:12px;padding:4px 10px;width:190px}
/* 퀴즈 */
.qboard{position:relative;width:1100px;height:620px;display:flex;align-items:center;justify-content:center}
.qboard>img{position:absolute;inset:0;width:100%;height:100%}
.qboard .qt{position:relative;width:70%;font-size:44px;text-align:center;line-height:1.35;margin-top:40px}
.qans{position:relative;width:760px;height:300px;display:flex;align-items:center;justify-content:center;margin-top:-40px}
.qans img{position:absolute;inset:0;width:100%;height:100%}
.qans span{position:relative;font-size:52px;color:#7a3e12}
/* 순서 */
.tiles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:1700px}
.tile{position:relative;width:300px;height:200px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%}
.tile span{position:relative;width:72%;text-align:center;font-size:24px;line-height:1.3}
.tile b{position:absolute;left:24px;top:18px;font-size:22px;color:#976232}
.tile.pick{outline:5px solid #E8B04A;border-radius:20px}
/* 크게 보기 */
.big{display:flex;gap:30px;max-width:1800px}
.big .panel{flex:1;background:#fff;border:3px solid var(--line);border-radius:22px;padding:24px;font-size:30px;line-height:1.5}
.big{align-items:flex-start;padding-bottom:30px}
.big .panel h3{font-size:30px;margin:0 0 12px;display:flex;gap:12px;align-items:center}.big .panel h3 img{width:64px}
.big .src{font-size:20px;color:#6c6455;margin-top:12px}
.graph{display:flex;align-items:flex-end;gap:20px;height:300px;margin:14px 0 4px;border-bottom:3px solid #8a8070}
.graph div{flex:1;background:#7A6A9C;color:#fff;font-size:24px;text-align:center;border-radius:6px 6px 0 0}
.glab{display:flex;gap:20px;font-size:24px}.glab span{flex:1;text-align:center}
.lots{display:flex;gap:40px;align-items:center}
.lots .res{font-size:44px;line-height:1.5}
#rv{position:fixed;left:8px;bottom:8px;z-index:100;background:#fffdf6;border:2px solid #976232;border-radius:12px;padding:8px 10px;font-size:13px;max-width:560px;box-shadow:0 6px 20px #0005;font-family:'맑은 고딕',sans-serif}
#rv b{color:#976232}#rv .rr{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
#rv button{font-family:inherit;font-size:12px;border:1px solid #C9BFA6;background:#fff;border-radius:8px;padding:3px 7px;cursor:pointer}
#rv button.on{background:#976232;color:#fff;border-color:#976232}#rv.min .rr{display:none}
.steps3{display:flex;gap:10px;margin:0 0 14px}
.steps3 div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:18px;max-width:200px;line-height:1.3}
.steps3 b{color:#976232;font-size:22px;display:block}
.domeempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;color:#6b7b80;padding:60px;line-height:1.4}
.hint{display:none}
/* 자료 크게 보기 — 사료는 오래된 한지 두루마리처럼 */
.big .panel.saryo{position:relative;background:#EFE2BF;background-image:radial-gradient(circle at 20% 30%,#f7edd2 0,transparent 40%),radial-gradient(circle at 80% 70%,#e3d09f 0,transparent 45%),repeating-linear-gradient(0deg,#00000006 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,#ffffff10 0 1px,transparent 1px 7px);
  border:0;border-radius:6px;box-shadow:inset 0 0 40px #8b6a3e55,0 8px 20px #0003;padding:46px 40px 34px;margin:18px 0}
.big .panel.saryo::before,.big .panel.saryo::after{content:'';position:absolute;left:-16px;right:-16px;height:22px;border-radius:11px;background:linear-gradient(#7a4f24,#4e3116 60%,#7a4f24);box-shadow:0 3px 6px #0005}
.big .panel.saryo::before{top:-12px}.big .panel.saryo::after{bottom:-12px}
.big .panel.saryo .quote{font-weight:bold;font-size:33px;line-height:1.75;color:#3a2814;letter-spacing:-.3px}
.big .panel.saryo .tag2{position:absolute;right:26px;top:22px;border:3px solid #9E2B22;color:#9E2B22;border-radius:6px;padding:0 10px;font-size:22px;transform:rotate(6deg);background:#ffffff40}
.role{display:inline-block;background:var(--g);color:#FFF9EA;border-radius:10px;padding:2px 12px;font-size:21px;margin-bottom:6px}
.gloss{margin-top:12px;font-size:23px;color:#4a3a22;background:#ffffffa0;border:2px solid #E2D2AE;border-radius:12px;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.gloss .gt{grid-column:1/-1;font-size:21px;color:#976232;font-weight:bold}
.gloss .gi{display:flex;gap:10px;line-height:1.35}.gloss .gi b{flex:none;color:#7a3e12}
.memo .gloss{font-size:30px}.memo .gloss .gt{font-size:24px}
.find{margin-top:14px;background:#fffdf6;border:2px dashed var(--b);border-radius:14px;padding:10px 14px;font-size:26px;line-height:1.45;color:#4a3a22}
.voices{display:flex;gap:18px;align-items:stretch}
.voice{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.voice .bub{position:relative;background:#F2F2EE;border-radius:28px;padding:18px 22px;font-size:27px;line-height:1.55;flex:1;width:100%}
.voice .bub::after{content:'';position:absolute;bottom:-18px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#F2F2EE;border-bottom:0}
.voice .who{display:flex;align-items:center;gap:10px;font-size:26px;color:#7a4b1c}
.voice .who img{height:230px;width:auto;object-fit:contain;margin-top:8px}
.voice .ph{width:110px;height:110px;border-radius:50%;background:#E9E1CD;display:flex;align-items:center;justify-content:center;font-size:20px;color:#8a8070;text-align:center;line-height:1.2}
.memo{background:#FFF7E6;border:3px solid #C9A46A;border-radius:18px;padding:14px 22px;max-width:1500px;margin:0 0 16px;font-size:26px;line-height:1.55;position:relative}
.memo .mh{font-size:24px;color:#976232;margin-bottom:4px}
.memo .ms{font-size:18px;color:#6c6455}
.memo .ma{margin-top:6px;color:#2F7A72}

/* ---------------- 연결 고리 ---------------- */
const groupOf = c => c.g || ((String(c.m||'').match(/^(\d)모둠/)||[])[1]) || '';
function cardHTML(c){
  const g=groupOf(c);
  return (c.std?'<span class="tag">교과서 단서</span>':'')+(g&&!c.std?`<span class="gb">${esc(g)}</span>`:'')+esc(c.t)+`<div class="m">${esc(c.m||'')}</div>`+(c.q?`<div class="qq">💬 ${esc(c.q)}</div>`:'');
}

let laneFocus='';  // ''=둘 다, 'c'=까닭만, 'r'=결과만

  const n=S.cards.filter(c=>c.ring===i&&c.k===k&&c.who!=='연표'&&(!who||(c.who||'')===who)).length;
  const fold = laneFocus && laneFocus!==k && i===S.ring && ['pair','together','check'].includes(S.phase);

let mt=null;
const MCOL=['#D9534F','#E8A33A','#4C9A5B','#3C7DC4','#8A5CC2','#C25C94','#2F7A72'];
function openMatch(){
  const M=R().match; if(!M) return;
  const left=M.pairs.map((p,i)=>({i,t:p[0],pg:p[1]})), right=M.pairs.map((p,i)=>({i,t:p[2],pg:p[3]}));
  for(let i=right.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [right[i],right[j]]=[right[j],right[i]];}
  mt={M,left,right,link:{},pick:null,checked:false}; drawMatch(); $('match').classList.add('show');
}
function drawMatch(){
  const {M,left,right,link,pick,checked}=mt;
  const colorOf = li => MCOL[li%MCOL.length];
  const rOwner = ri => { const k=Object.keys(link).find(l=>link[l]===ri); return k===undefined?null:+k; };
  const tile=(side,x,idx)=>{ const li = side==='l'?idx:rOwner(idx); const on = side==='l' ? link[idx]!==undefined : li!==null;
    const good = checked&&on&&(side==='l'?right[link[idx]].i===x.i:left[li].i===x.i);
    return `<div class="mtile ${side} ${pick&&pick.side===side&&pick.idx===idx?'pick':''} ${checked&&on?(good?'good':'bad'):''}" data-s="${side}" data-x="${idx}">
      <span class="no" style="${on?`background:${colorOf(li)};border:3px solid ${colorOf(li)}`:''}">${on?li+1:''}</span>${esc(x.t)} <small>(${esc(x.pg)}쪽)</small></div>`; };
  const ok = checked ? left.filter((x,i)=>link[i]!==undefined&&right[link[i]].i===x.i).length : 0;
  $('match').innerHTML=`<button class="btn close" onclick="$('match').classList.remove('show')">닫기</button>
    <h2 class="f" style="margin-bottom:4px">선 잇기 답 맞추기 — ${esc(M.title)}</h2><p style="font-size:24px;color:#655F52;margin:0 0 14px">${esc(M.hint)}</p>
    <div class="mt"><div class="mcol"><h3 class="f" style="color:#2F7A72">까닭 · 무엇이 문제였나?</h3>${left.map((x,i)=>tile('l',x,i)).join('')}</div>
      <div class="mcol"><h3 class="f" style="color:#A0562C">결과 · 어떻게 했나?</h3>${right.map((x,i)=>tile('r',x,i)).join('')}</div></div>
    <div style="display:flex;gap:14px;margin-top:18px;align-items:center"><button class="btn" id="mChk" style="display:flex;align-items:center;gap:8px">${spr(SP.bell,'',null,'width:40px')}확인</button>
      <button class="btn l" id="mPut">맞힌 짝을 칠판 카드로</button><span style="font-size:24px" class="f">${checked?`${ok} / ${left.length} 짝 맞음`:''}</span></div>`;
  $('match').querySelectorAll('.mtile').forEach(t=>t.onclick=()=>{ const side=t.dataset.s, idx=+t.dataset.x; mt.checked=false;
    if(side==='l'){ mt.pick={side,idx}; }
    else if(mt.pick&&mt.pick.side==='l'){ const o=rOwner(idx); if(o!==null) delete link[o]; link[mt.pick.idx]=idx; mt.pick=null; }
    else { const o=rOwner(idx); if(o!==null) delete link[o]; }
    drawMatch(); });
  $('mChk').onclick=()=>{ mt.checked=true; mt.pick=null; drawMatch(); };
  $('mPut').style.display='none'; $('mPut').onclick=()=>{ left.forEach((x,i)=>{ if(link[i]!==undefined&&right[link[i]].i===x.i){
      S.cards.push({ring:S.ring,k:'c',t:x.t,m:'학급 짝 맞추기 · '+x.pg+'쪽'}); S.cards.push({ring:S.ring,k:'r',t:right[link[i]].t,m:'학급 짝 맞추기 · '+right[link[i]].pg+'쪽'}); } });
    $('match').classList.remove('show'); commit(); };
}

function renderQuest(){

  rs.forEach((Rg,i)=>{ if(i>0) steps.push(['역사 연결 사슬',S.ring===i&&ph==='read'&&!S.linked[i-1],!!S.linked[i-1]]);
    steps.push(['역사 연결 고리 '+(i+1),S.ring===i&&!['lotto','quiz','end','question'].includes(ph)&&!(i>0&&ph==='read'&&!S.linked[i-1]),!!S.done[i]]); });
  if(L().closeQuestion) steps.push(['질문 카드',ph==='question',ph==='end']);
  steps.push(['역사 연결 사슬 말하기',ph==='end',false]);
  const sub = (R()&&R().match?{read:'자료 읽기',pair:R().together?'다 함께 선 잇기':'선 잇기',check:'모둠 한 줄',sort:'분류하기',write:'우리 반 한 줄'}:{read:'자료 읽기',pair:'모둠 활동',together:'다 함께',check:'확인',write:'연표 쓰기'})[ph];
  $('quest').classList.toggle('many', steps.length>7);
  $('quest').innerHTML=steps.map(([t,on,ok],i)=>`${i?'<span class="qarrow">›</span>':''}<span class="qs ${on?'on':ok?'ok':''}"><i>${ok&&!on?'✔':i+1}</i>${t}${on&&sub&&t.startsWith('역사')?` · ${sub}`:''}</span>`).join('')
    ;
}

    d.appendChild(b);
  });
  const pend=S.pending||[];
  $('vol').innerHTML=(pend.length?`자원한 친구 (눌러서 확정): ${pend.map(n=>`<button class="pb" data-n="${esc(n)}">${esc(n)} ✔</button>`).join('')}<br>`:'<span style="color:#8a8070">수업 전에 자원한 친구 이름을 넣어요</span><br>')+`<input id="nn" placeholder="이름 직접 넣기"> <button class="pb" id="nadd">넣기</button>`;
  $('vol').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ const n=b.dataset.n; S.pending=pend.filter(x=>x!==n); if(!S.names.includes(n)) S.names.push(n); commit(); });

  if(last && !spin){ const b=document.createElement('div'); b.className='ball'; b.innerHTML=`<img class="px" src="img/${ballOf(last)}"><span>${esc(last)}</span>`; $('bowl').appendChild(b); b.animate([{transform:'translateY(-200px)'},{transform:'none'}],{duration:500,easing:'cubic-bezier(.3,1.6,.6,1)'}); }
  $('wtxt').innerHTML = spin ? '두구두구…' : (last ? `${S.leaders.length===1?'진행':'기록'} 이끄미 <b style="color:#976232">${esc(last)}</b>` : '');
  $('draw').style.display = S.leaders.length<2 ? 'inline-block':'none';

  $('pass').style.display = (last && !S.passUsed && !spin) ? 'inline-block':'none';
  $('go').style.display = S.leaders.length===2 && !spin ? 'inline-block':'none';
  $('lguide').src='img/'+(last&&!spin?'S6_04_researcher_thumb':'S6_01_researcher_crank')+'.webp';
  $('lguide2').src='img/'+(last&&!spin?'S6F_04_researcher_f_thumb':'S6F_01_researcher_f_crank')+'.webp';
}
$('draw').onclick=()=>{
  if(!S.names.length){ alert('먼저 이끄미 이름을 확정해 주세요'); return; }
  let pool=S.names.filter(n=>!S.used.includes(n)); if(!pool.length){ S.used=[]; pool=S.names.slice(); }
  $('draw').disabled=true; syncState.hold=true; renderLotto(true);
  setTimeout(()=>{ const w=pool[Math.floor(Math.random()*pool.length)]; S.used.push(w); S.leaders.push(w); $('draw').disabled=false; syncState.hold=false; commit(); }, 1900);
};
$('pass').onclick=()=>{ S.passUsed=true; S.leaders.pop(); commit(); };
$('go').onclick=()=>{ S.phase=(L().quiz&&L().quiz.length)?'quiz':'read'; qi=0; qshow=false; commit(); };

/* ---------------- 검토 패널 (시험 서버이거나 주소에 review=1) ---------------- */
const REVIEW = API === '/api' || QS.get('review') === '1' || !REMOTE;
function jump(lesson, ring, phase){
  S.lesson=lesson; S.ring=ring; S.phase=phase;
  const n=lessonOf(S).rings.length;
  S.done=[0,1,2,3].map(i=>i<ring || (i===ring && ['question','end'].includes(phase)));
  S.linked=[0,1,2].map(i=>i<ring && !(phase==='read'&&i===ring-1));
  S.stdShown=[0,1,2,3].map(i=>i<ring?3:0); laneFocus=''; bridgeOpen=false;
  if(phase!=='lotto' && S.leaders.length<2){ if(S.names.length<2) S.names=['가람','나래','다온']; S.leaders=S.names.slice(0,2); S.used=S.leaders.slice(); }
  if(phase==='quiz'){ qi=0; qshow=false; }
  commit();
}

  let h=`<b>검토 패널</b> (수업 때는 보이지 않음) <button onclick="$('rv').classList.toggle('min')">접기/펴기</button>
    <div class="rr">차시 ${Object.keys(LESSONS).map(k=>btn(+k===S.lesson,k+'차시',`jump(${k},0,'lotto')`)).join('')}</div>
    <div class="rr">${ph.map(([p,l])=>btn(S.phase===p,l,`jump(${S.lesson},0,'${p}')`)).join('')}</div>`;
  rs.forEach((R0,i)=>{ const main=R0.mode==='together'?['together','다 함께']:['pair',R0.match?'선 잇기':'모둠 활동'];
    h+=`<div class="rr">역사 연결 고리 ${i+1}·${esc(R0.name)}: ${(R0.match? flowOf(R0).map(p=>[p,{read:i?'사슬·자료 읽기':'자료 읽기',pair:'선 잇기',check:'모둠 한 줄',sort:'분류하기',write:'우리 반 한 줄'}[p]]) : [['read',i?'사슬·자료 읽기':'자료 읽기'],main,['check','확인'],['write','연표 쓰기']]).map(([p,l])=>btn(S.ring===i&&S.phase===p,l,`jump(${S.lesson},${i},'${p}')`)).join('')}</div>`; });
  h+=`<div class="rr">${Lx.closeQuestion?btn(S.phase==='question','질문 카드',`jump(${S.lesson},${rs.length-1},'question')`):''}${btn(S.phase==='end','역사 연결 사슬 말하기',`jump(${S.lesson},${rs.length-1},'end')`)}
    <button onclick="(R().sample||[]).forEach(x=>S.cards.push(Object.assign({},x,{ring:S.ring,ex:1}))); commit();">예시 카드 넣기</button><button onclick="S.cards=S.cards.filter(c=>!c.ex); commit();">예시 카드 빼기</button>
    ${R()&&R().match?'<button onclick="openCheck()">선 잇기 정답</button>':''}<button onclick="openTimeline()">우리 반 연표</button>
    <button onclick="if(confirm('이 학급 카드를 모두 지울까요?')) act({a:'reset',code:CODE}).then(r=>{ if(r.ok){ S=Object.assign(freshState(),r.st); SERVER=clone(S); render(); } })">카드 모두 지우기</button></div>`;
  const min=el.classList.contains('min'); el.innerHTML=h; if(min) el.classList.add('min');
}

/* ---------------- 상태 ---------------- */
let HK;
function autoHow(){ /* 한 장짜리 안내는 자동으로 띄우지 않음(단계마다 '지금 할 일' 띠) — 나중에 안내 영상으로 */ }
function render(){ renderReview(); renderQuest(); autoHow(); $('ttl').innerHTML=(typeof SERIES!=='undefined'?`<div class="kick"><b>${esc(SERIES.school)}</b> ${esc(SERIES.slogan)} <span>${S.lesson}차시 / ${esc(SERIES.of)}</span></div>`:'')+esc(L().title)+(L().goal?`<div style="font-size:19px;color:#D9E6DC;font-family:SeoulHangangJang,sans-serif;margin-top:4px;line-height:1.25"><b style="color:#E8C27A">오늘의 목표</b> ${esc(L().goal)}</div>`:''); if($('lkick')&&typeof SERIES!=='undefined') $('lkick').innerHTML=`${esc(SERIES.school)} · <b>${esc(SERIES.slogan)}</b>`; $('l1').textContent=S.leaders[0]||'—'; $('l2').textContent=S.leaders[1]||'—'; renderMain(); renderBottom(); renderLotto(false); renderQuiz(); }
const KEYS=PATCH_KEYS;
function diff(a,b){
  const set={}; KEYS.forEach(k=>{ if(JSON.stringify(a[k])!==JSON.stringify(b[k])) set[k]=b[k]; });
  const edits=[], add=[];
  const del=a.cards.filter(x=>x.id&&!b.cards.some(y=>y.id===x.id)).map(x=>x.id);
  b.cards.forEach(c=>{ if(!c.id){ add.push(c); return; } const o=a.cards.find(x=>x.id===c.id); if(!o) return;
    const e={id:c.id}; let ch=false; ['k','ring','ok','fresh','who'].forEach(k=>{ if(o[k]!==c[k]){ e[k]=c[k]; ch=true; } }); if(ch) edits.push(e); });
  return (Object.keys(set).length||edits.length||add.length||del.length) ? {set,edits,add,del} : null;
}
async function commit(){
  render();
  const p=diff(SERVER||freshState(),S); if(!p) return;
  syncState.hold=true;
  try{ const r=await act(Object.assign({a:'patch',code:CODE},p));
       if(r.ok){ S=Object.assign(freshState(),r.st); SERVER=clone(S); }
       else if(r.msg==='code'){ alert('진행 코드가 맞지 않아 바꿀 수 없어요. 새로 고침 후 코드를 다시 넣어 주세요.'); localStorage.removeItem('hfy_code'); S=clone(SERVER); } }
  catch(e){ setNet(false); }
  syncState.hold=false; render();
}
if(REMOTE){
  if(!CODE) CODE=(prompt('전자칠판 진행 코드를 넣어 주세요 (스프레드시트 「안내」 탭에 있어요). 비워 두면 보기만 해요.')||'').trim();
  if(CODE) apiCheck(CODE).then(ok=>{ if(ok) localStorage.setItem('hfy_code',CODE); else { alert('진행 코드가 맞지 않아요. 지금은 보기만 할 수 있어요.'); CODE=''; } }).catch(()=>{});
}
/* 반마다 차시가 바뀌면: 지난 차시 우리 반 연표를 보관하고 새 차시를 처음부터 (이끄미 후보·지난 이끄미는 남김) */
const TRY_CLASS = /^(검토|test|play)/i.test(CLASS);
function archiveLesson(st){ try { const k='hfy_hist_'+CLASS, h=JSON.parse(localStorage.getItem(k)||'{}');
  const lines=(st.cards||[]).filter(c=>c.who==='연표').map(c=>({ring:c.ring,t:c.t}));
  if(lines.length||st.phase==='end') h[st.lesson]={lines, end:st.phase==='end', at:new Date().toISOString().slice(0,10)};
  localStorage.setItem(k, JSON.stringify(h)); } catch(e){} }
function markDone(){ if(S.phase!=='end') return; try { const k='hfy_done_'+CLASS, d=JSON.parse(localStorage.getItem(k)||'{}'); if(!d[S.lesson]){ d[S.lesson]=true; localStorage.setItem(k, JSON.stringify(d)); } } catch(e){} }
let lessonChecked=false;
async function checkLessonChange(){
  lessonChecked=true; const want=LESSON_NO(); if(!want || S.lesson===want || !LESSONS[want]) return false;
  const fresh = S.phase==='lotto' && !(S.cards||[]).length && !(S.leaders||[]).length;
  if(fresh){ S.lesson=want; commit(); return true; }
  if(TRY_CLASS){ return false; }
  if(!confirm(`${CLASS}반은 지난번에 ${S.lesson}차시를 했어요.
${want}차시를 새로 시작할까요?
(${S.lesson}차시 우리 반 연표는 이 컴퓨터에 보관되고, 이끄미 후보 이름은 그대로 남아요)`)) return false;
  archiveLesson(S); const keep={names:S.names, used:S.used};
  const r=await act({a:'reset',code:CODE}); if(!r.ok){ alert('새 차시로 바꾸지 못했어요. 진행 코드를 확인해 주세요.'); return false; }
  SERVER=Object.assign(freshState(), r.st); S=Object.assign(clone(SERVER), {lesson:want, phase:'lotto', ring:0, names:keep.names, used:keep.used, leaders:[]}); qhits={}; qseen={}; qi=0; qshow=false; await commit(); return true;
}
syncState(ns=>{ const typing=document.activeElement&&document.activeElement.id==='tin'&&document.activeElement.value; S=ns; SERVER=clone(ns); if(typing) return;
  if(!lessonChecked){ checkLessonChange().then(ch=>{ if(ch) render(); }); }
  markDone(); render(); }, 2000);
render();
</script>
